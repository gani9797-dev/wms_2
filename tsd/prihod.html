<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ТСД — Приход</title>
<style>
:root{--vio:#6432FF;--ink:#1C2331;--mut:#8A92A6;--line:#EAEAEA;--bg:#F4F5F7;--ok:#2E7D32;--bad:#C62828;--warn:#E65100}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--ink);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5}
header .t{display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}header small{color:var(--mut);display:block;font-size:12px}
header a{color:#fff;text-decoration:none;font-size:16px;border:1px solid #444;border-radius:8px;padding:6px 10px}
main{padding:12px;max-width:640px;margin:0 auto;padding-bottom:40px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card.red{border-color:#EF9A9A;background:#FFEBEE}.card.green{border-color:#A5D6A7;background:#E8F5E9}.card.amber{border-color:#FFCC80;background:#FFF8E1}
h2{margin:0 0 8px;font-size:20px}.mut{color:var(--mut);font-size:13px}
input,select{width:100%;font-size:20px;padding:14px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:#fff}
button{width:100%;font-size:19px;font-weight:700;padding:16px;border-radius:12px;border:1px solid var(--vio);background:var(--vio);color:#fff;cursor:pointer;margin:6px 0;min-height:58px}
button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
button.red{background:var(--bad);border-color:var(--bad)}
button.green{background:var(--ok);border-color:var(--ok)}
button.amber{background:#EF6C00;border-color:#EF6C00}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.prog{height:12px;background:#E6E6E6;border-radius:8px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:#009900}
.doc{padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;cursor:pointer}
.doc b{color:var(--vio);font-size:18px}
.step{font-size:12px;color:var(--vio);font-weight:700;margin-bottom:4px}
.big{font-size:24px;font-weight:700;text-align:center}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;display:none;z-index:99;max-width:92vw;font-size:16px}
table.mini{width:100%;border-collapse:collapse;font-size:14px}table.mini td,table.mini th{border-bottom:1px solid #F0F0F0;padding:8px;text-align:left}
.hidden{display:none}
#navback{position:fixed;left:12px;bottom:16px;z-index:98;width:auto;padding:12px 18px;min-height:48px;font-size:16px;display:none;background:#fff;color:#1C2331;border:1px solid #EAEAEA;border-radius:12px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.15);cursor:pointer;margin:0}
.hint{background:#F3F0FF;border:1px solid #D8CEFF;border-radius:10px;padding:8px 10px;font-size:13px;color:#3B2A80;margin:8px 0}
.kbd{display:inline-block;border:1px solid #B9A9FF;background:#fff;border-radius:6px;padding:0 6px;font-weight:700;color:#4B2FD0}
/* Признак «Приёмка без с/н» в шапке — заметно, чтобы оператор видел режим сразу. */
.badge{display:none;background:#EF6C00;color:#fff;font-size:14px;font-weight:700;padding:8px 12px;border-radius:10px;margin:8px 0 0;text-align:center;letter-spacing:.3px}
.badge.on{display:block}
.mini-badge{display:inline-block;background:#EF6C00;color:#fff;border-radius:6px;padding:2px 6px;font-size:11px;font-weight:700}
.mini-badge.ok{background:var(--ok)}
.list{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px;margin:8px 0}
.list div{padding:5px 4px;border-bottom:1px solid #F5F5F5;font-size:14px;word-break:break-all}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #F0F0F0;font-size:15px}
.kv i{font-style:normal;color:var(--mut)}.kv b{color:var(--vio);text-align:right}
.tw{overflow-x:auto}
table.mini input{font-size:15px;padding:8px;margin:0;min-width:150px}
</style>
</head>
<body>
<header><div class="t"><a href="app.html">‹ Меню</a><b>ТСД — Приход</b><span id="who" style="font-size:12px;color:#7CFC9A"></span></div><small id="dhead">этап 1 · сканируй ворота</small>
<div id="noserial" class="badge">Приёмка без с/н</div></header>
<main id="m"></main>
<div id="toast"></div>
<button id="navback">← Назад</button>
<script>
const $=id=>document.getElementById(id);
const TOKEN=localStorage.getItem('tsd_token')||(window.WMS_TSD_TOKEN||'tsd-12345');
const ME=JSON.parse(localStorage.getItem('tsd_me')||'null');
if(ME)$('who').textContent=ME.fio;
const uid=()=>ME?ME.id:null;
let DOC=null,ITEM=null,PALLET=null,CROSS=false,MARKS=0,CHZ=false,GATE='',PENDING_QTY=0,BATCH='',BATCHES=[];
let SCREEN=''; // текущий экран — для горячих клавиш формы «Приёмка»
let PALLET_OPENED=''; // SSCC, для которого уже открыто тарное место
let QTY_POSTED=false; // количество по текущему шагу уже записано (защита от повторного POST)
let ALLOW_EXCESS=false; // оператор подтвердил приёмку с излишком по строке
// Серийные номера и дата производства (новое требование приёмки).
let SER=[];            // отсканированные с/н текущей позиции
let NOSERIAL=false;    // режим «Приёмка без с/н» (оператор ввёл «000»)
let NEED_SERIAL=false; // по позиции включено сканирование с/н на входе
let NEED_PDATE=false;  // по позиции включён контроль даты производства
let PROD_DATE='';      // дата производства партии
let REJECT_REASON='';  // причина отбраковки по строке
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600)}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Признак «Приёмка без с/н» — в шапке ТСД.
function noSerialBadge(on){const b=$('noserial');if(b)b.classList.toggle('on',!!on)}
function api(p,o){o=o||{};o.headers=Object.assign({'Content-Type':'application/json','X-Tsd-Token':TOKEN},o.headers||{});return fetch('prihod.php'+p+(p.includes('?')?'&':'?')+'token='+encodeURIComponent(TOKEN),o)}
const post=(a,b)=>api('?action='+a,{method:'POST',body:JSON.stringify(b||{})}).then(r=>r.json().then(j=>({s:r.status,j})));
const fmt=n=>Math.round((+n||0)*1000)/1000;
function head(){$('dhead').textContent=DOC?('№ '+(DOC.doc_no||DOC.id)+' · '+(DOC.status||'')):'этап 1 · сканируй ворота'}
// --- Навигация: стек кадров; кнопка «← Назад» и ESC возвращают на предыдущий кадр ---
let NAV=[];
function paintBack(){const b=$('navback');if(b)b.style.display=NAV.length>1?'block':'none'}
function go(name,fn){NAV.push({name,fn});if(NAV.length>40)NAV.splice(0,NAV.length-40);paintBack();const r=fn();if(r&&r.catch)r.catch(()=>{})}
function goReplace(name,fn){if(NAV.length)NAV[NAV.length-1]={name,fn};else NAV.push({name,fn});paintBack();const r=fn();if(r&&r.catch)r.catch(()=>{})}
function back(){if(NAV.length>1){NAV.pop();paintBack();const r=NAV[NAV.length-1].fn();if(r&&r.catch)r.catch(()=>{})}}
$('navback').onclick=()=>back();
document.addEventListener('keydown',e=>{
  // ESC — назад на предыдущий шаг (работает на каждом экране)
  if(e.key==='Escape'){e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();back();return}
});
// --- 1. Этап: сканируем ворота (это ячейка хранения из зоны «Приёмка») ---
let CELLS=[]; // ячейки приёмки (DOK-01…DOK-10) из таблицы ячеек хранения
async function scrGate(){
 try{const r=await api('?action=receiving_cells');const j=await r.json();CELLS=j.cells||[]}catch(e){}
 const list=CELLS.length?CELLS.map(c=>`<option value="${c}">`).join(''):'';
 $('m').innerHTML=`<div class="card"><div class="step">ЭТАП 1 · ВОРОТА (ЯЧЕЙКА ПРИЁМКИ)</div><h2>Сканируй ворота</h2>
<input id="gate" placeholder="Ячейка приёмки (напр. DOK-01)" autocomplete="off" value="${GATE}" list="cells">
<datalist id="cells">${list}</datalist>
<button id="go">Далее</button>
<div class="mut">${CELLS.length?('Ячейки приёмки: '+CELLS.join(', ')):'Справочник ячеек приёмки недоступен'}</div></div>`;
const e=$('gate');e.focus();e.onkeydown=v=>{if(v.key==='Enter'){v.preventDefault();next()}};
$('go').onclick=next;
function next(){const v=e.value.trim();if(!v){toast('Отсканируй ворота');return}
 // Проверка: ворота = ячейка приёмки (зона «Приёмка» в таблице ячеек хранения).
 if(CELLS.length&&!CELLS.some(c=>c.toUpperCase()===v.toUpperCase())){
  toast('Ячейка приёмки не найдена: '+v+' · доступны: '+CELLS.join(', '));e.focus();return}
 GATE=v;go('docs',scrDocs)}}
// --- 2. Этап: документы с этими воротами + штрихкод документа ---
async function scrDocs(){ITEM=null;PALLET=null;CROSS=false;DOC=null;BATCH='';BATCHES=[];SCREEN='docs';
SER=[];NOSERIAL=false;NEED_SERIAL=false;NEED_PDATE=false;PROD_DATE='';REJECT_REASON='';noSerialBadge(false);head();
const r=await api('?action=docs&gate='+encodeURIComponent(GATE));const j=await r.json();const rows=j.rows||[];
$('m').innerHTML=`<div class="card"><div class="step">ЭТАП 2 · ДОКУМЕНТ · ВОРОТА ${GATE}</div><h2>Выбор документа поставки</h2>
<input id="doccode" placeholder="Штрихкод документа (№ прихода)" autocomplete="off">
<button id="docgo">Открыть по штрихкоду</button>
<div class="mut">Документов с воротами ${GATE}: ${rows.length} · показаны только непринятые · выбери Приход из списка или отсканируй штрихкод документа</div></div>`
+(rows.length?'':`<div class="card amber"><div class="mut">С этими воротами непринятых документов нет — отсканируй штрихкод документа выше.</div></div>`)
+rows.map(t=>`<div class="doc" data-id="${t.id}"><b>${t.doc_no}</b> <span class="mut">${t.external_no||''} · ${t.supplier||''}</span><br><span class="mut">${t.warehouse||''} · ворота ${t.gate||'—'} · ${t.status}</span><div class="prog"><i style="width:${t.pct}%"></i></div><span class="mut">${t.fact_qty||0} / ${t.plan_qty||0}</span><button class="ghost" style="width:auto;min-width:90px;padding:8px 12px;font-size:13px;margin-top:6px" data-info="${t.id}">Информация</button></div>`).join('');
async function openDoc(id){
// Ворота из этапа 1 проставляются в документ (в Поступлениях номер ворот обновляется).
const {s,j:jj}=await post('start',{receipt_id:id,gate:GATE,user_id:uid()});
if(jj.error){toast('Ошибка: '+jj.error);return}
const st=await (await api('?action=state&receipt_id='+id)).json();DOC=st.head;head();go('ean',scrEan)}
document.querySelectorAll('.doc').forEach(el=>el.onclick=()=>openDoc(+el.dataset.id));
document.querySelectorAll('.doc [data-info]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();const id=btn.dataset.info;const t=rows.find(r=>r.id==+id);if(t){toast('Приход '+t.doc_no+': принято '+(t.fact_qty||0)+' / '+t.plan_qty+' шт ('+t.pct+'%)')}});
const dc=$('doccode');dc.onkeydown=v=>{if(v.key==='Enter'){v.preventDefault();openByCode()}};
$('docgo').onclick=openByCode;
async function openByCode(){const v=dc.value.trim();if(!v){toast('Отсканируй штрихкод документа');return}
const r=await api('?action=doc_by_code&code='+encodeURIComponent(v));const j=await r.json();
if(!j.found){toast('Документ не найден среди документов в работе');return}
toast('Приход '+j.doc.doc_no);openDoc(j.doc.id)}}
// --- 4. Этап: вопрос «это кросс-док?» ---
function scrCrossQ(ms){SCREEN='crossq';$('m').innerHTML=`<div class="card"><div class="step">ЭТАП 4 · КРОСС-ДОК?</div><h2>Это кросс-док?</h2>
<div class="row2"><button class="amber" id="y">Да</button><button class="ghost" id="n">Нет</button></div></div>`;
$('y').onclick=()=>{CROSS=true;go('cross',()=>scrCross(ms))};$('n').onclick=()=>{CROSS=false;go('measure',()=>scrMeasure(ms,afterMeasure))}}
function scrCross(ms){SCREEN='cross';$('m').innerHTML=`<div class="card"><div class="step">КРОСС-ДОК</div><h2>Паллет кросдок (SSCC KD)</h2>
<input id="sscc" placeholder="Сканируй SSCC паллета"><input id="cg" placeholder="Ячейка ворот" value="${GATE||(DOC.gate||'')}">
<button id="go">Создать строку кросдока</button></div>`;
$('sscc').focus();$('go').onclick=async()=>{const ss=$('sscc').value.trim();if(!ss){toast('Отсканируй SSCC');return}
const {j}=await post('crossdock',{receipt_id:DOC.id,gate_id:$('cg').value.trim(),sscc:ss});
if(j.error){toast('Ошибка: '+j.error);return}PALLET=ss;toast('Строка кросдока создана');go('measure',()=>scrMeasure(ms,afterMeasure))}}
// --- Дальше после обмеров: марки (ЧЗ) или сразу форма «Приёмка» (ввод количества вручную) ---
function afterMeasure(){if(CHZ){MARKS=0;toast('Группа «Легкая промышленность» — сканирование Честного знака обязательно');go('marks',scrMarks)}else{go('accept',()=>scrAccept(0))}}
// --- Скан EAN ---
function scrEan(){SCREEN='ean';$('m').innerHTML=`<div class="card"><div class="step">ЭТАП 3 · СКАН ТОВАРА</div><h2>Штрихкод товара (EAN-13)</h2>
<input id="ean" placeholder="Скан..." autocomplete="off"><button id="go">Найти</button>
<button class="ghost" id="all">Принять весь приход</button>
<button class="ghost" id="fin">Завершить приёмку</button>
<div class="mut">Паллета: ${PALLET||'—'}${CROSS?' · кросс-док':''}</div>
<div class="mut">«Принять весь приход» — всё количество по документу без номеров паллет. Не сработает для товаров со сканированием с/н или Честного знака.</div></div>`;
const e=$('ean');e.focus();e.onkeydown=v=>{if(v.key==='Enter'){v.preventDefault();find()}};$('go').onclick=find;$('fin').onclick=()=>go('finish',scrFinish);
$('all').onclick=acceptAllReceipt;
 async function find(){const v=e.value.trim();if(!v){toast('Отсканируй штрихкод');return}
 const r=await api('?action=ean&receipt_id='+DOC.id+'&ean='+encodeURIComponent(v));const j=await r.json();
 if(!j.found){go('unclaimed',()=>scrUnclaimed(v));return}ITEM=j.item;CHZ=!!j.chz_required;BATCHES=j.batches||[];
 // Флаги позиции: сканирование с/н на входе и контроль даты производства.
 const f=j.flags||{};NEED_SERIAL=!!f.serial_in;NEED_PDATE=!!f.prod_date;
 SER=[];NOSERIAL=false;PROD_DATE='';REJECT_REASON='';ALLOW_EXCESS=false;noSerialBadge(false);
 const nb=BATCHES.filter(b=>String(b.batch||'')!=='' && batchRest(b)>0.0001);
 if(BATCHES.length>1&&nb.length>1){BATCH='';go('batch',()=>scrBatch(j.measure))}
 else{BATCH=nb.length===1?String(nb[0].batch):(BATCHES.length===1?String(BATCHES[0].batch||''):'');go('crossq',()=>scrCrossQ(j.measure))}}}
// «Принять весь приход»: остатки всех строк без паллет. Позиции с с/н и ЧЗ
// принять оптом нельзя — backend вернёт их в skipped, их принимаем вручную.
async function acceptAllReceipt(){
 if(!DOC){toast('Сначала выбери документ');return}
 if(!confirm('Принять весь приход в полном объёме? Товар будет принят без номеров паллет.'))return;
 const {s,j}=await post('accept_all',{receipt_id:DOC.id,user_id:uid(),user_fio:ME?ME.fio:''});
 if(j.error){toast('Ошибка: '+j.error);return}
 const acc=j.accepted||[], skip=j.skipped||[];
 if(skip.length){
  $('m').innerHTML=`<div class="card amber"><div class="step">ПРИНЯТЬ ВЕСЬ ПРИХОД</div>
  <h2>Принято оптом: ${acc.length} поз.</h2>
  <div class="mut">Эти позиции нельзя принять автоматически: требуется сканирование с/н или Честного знака.</div>
  <table class="mini"><tr><th>Артикул</th><th>Причина</th></tr>${skip.map(x=>`<tr><td>${esc(x.sku)}</td><td>${esc(x.reason)}</td></tr>`).join('')}</table>
  <button id="allbk" class="green">Продолжить приёмку вручную</button></div>`;
  $('allbk').onclick=()=>go('ean',scrEan);
  toast('Принято: '+acc.length+', требуют ручной приёмки: '+skip.length);
  return;
 }
 toast('Принят весь приход: позиций '+acc.length);
 PALLET=null;scrNext();
}
function batchLabel(b){return b===''?'— без партии —':b}
// --- Выбор партии поставщика: показываем только непринятые партии ---
function batchRest(b){return Math.round(((+b.plan||0)-(+b.fact||0))*1000)/1000}
function scrBatch(ms){SCREEN='batch';
const pending=BATCHES.filter(b=>batchRest(b)>0.0001);
if(!pending.length){$('m').innerHTML=`<div class="card green"><div class="step">ПАРТИИ · ${ITEM.sku}</div>
<h2>Все партии приняты</h2><div class="mut">По позиции не осталось непринятых партий.</div>
<button class="ghost" id="bk">Назад к сканированию</button></div>`;$('bk').onclick=()=>back();return}
const rows=pending.map((b,i)=>{const pl=+b.plan||0,fa=+b.fact||0,rest=batchRest(b);
return `<div class="doc" data-b="${i}"><b>Партия: ${batchLabel(b.batch)}</b><br><span class="mut">План: ${pl} · Принято: ${fa} · Осталось: ${rest}</span></div>`}).join('');
$('m').innerHTML=`<div class="card"><div class="step">ПАРТИЯ ПОСТАВЩИКА · ${ITEM.sku}</div><h2>${ITEM.name||''}</h2>
<div class="mut">Выбери непринятую партию. Осталось партий: ${pending.length}</div>${rows}</div>`;
document.querySelectorAll('.doc').forEach(el=>el.onclick=()=>{const b=pending[+el.dataset.b];BATCH=String(b.batch||'');
toast('Партия: '+batchLabel(BATCH));go('crossq',()=>scrCrossQ(ms))})}
// --- Обмеры: новый товар -> ввести габариты; существующий -> показать + подтвердить ---
function scrMeasure(ms,next){SCREEN='measure';ms=ms||null;
if(ms&&!ms.need&&ms.length_mm!=null){
$('m').innerHTML=`<div class="card green"><div class="step">ЗАМЕРЫ ТОВАРА · ${ITEM.sku}</div>
<h2>${ms.length_mm} × ${ms.width_mm} × ${ms.height_mm} мм · ${ms.weight_g} г</h2>
<div class="mut">${ITEM.name||''}</div><button id="go">Замеры верны — далее</button></div>`;
$('go').onclick=next;return}
if(!ms||!ms.need){next();return}
const stale=ms.measure_reason==='stale';
$('m').innerHTML=`<div class="card amber"><div class="step">${stale?'ОБМЕРЫ УСТАРЕЛИ':'НОВЫЙ ТОВАР'} · ${ITEM.sku}</div>
<h2>Требуются обмеры!</h2><div class="mut">${ITEM.name||''} — ${stale?'последнее движение более 2 месяцев назад, нужны новые замеры':'товар новый (ранее не было на складе)'}. Введи длину, ширину, высоту в мм и вес в г, без них дальше нельзя.</div>
<input id="ml" placeholder="Длина, мм" inputmode="numeric"><input id="mw" placeholder="Ширина, мм" inputmode="numeric">
<input id="mh" placeholder="Высота, мм" inputmode="numeric"><input id="mg" placeholder="Вес, г" inputmode="numeric">
<button id="go">Сохранить обмеры</button></div>`;
$('go').onclick=async()=>{const b={sku:ITEM.sku,length_mm:+$('ml').value||0,width_mm:+$('mw').value||0,height_mm:+$('mh').value||0,weight_g:+$('mg').value||0,user_id:uid()};
if(b.length_mm<=0||b.width_mm<=0||b.height_mm<=0||b.weight_g<=0){toast('Все 4 замера обязательны и больше нуля');return}
const {j}=await post('measure_save',b);

const F=await factOf();
const total0=proposed!=null?fmt(proposed):fmt(F.fact);
const over=Math.max(0,fmt(total0-F.plan));
const notFull=fmt(F.fact)<fmt(F.plan);
const warn=notFull
?`Сначала прими заявленное количество по строке: принято <b>${fmt(F.fact)}</b>, по документу <b>${fmt(F.plan)}</b> шт. Излишек можно зафиксировать, когда строка принята по документу.`
:(over>0
?`ВНИМАНИЕ: вы приняли <b>${total0}</b> шт, а по документу в партии <b>${batchLabel(BATCH)}</b> — <b>${fmt(F.plan)}</b> шт. Излишек <b>${over}</b> шт — подтверди пересчётом, будет сформирован «Акт об излишке».`
:`Принято <b>${fmt(F.fact)}</b> / по документу <b>${fmt(F.plan)}</b> шт. Если приёмка лишняя — вбей фактическое количество после пересчёта.`);
$('m').innerHTML=`<div class="card red"><div class="step">ИЗЛИШКИ · ${ITEM.sku}</div><h2>${total0} / ${fmt(F.plan)}</h2>
<div class="mut">${warn}</div>
<input id="tt" value="${total0}" inputmode="numeric" placeholder="Итого принято (после пересчёта)">
<button id="ok" class="red">Подтвердить излишек</button>
<button class="ghost" id="bk">Назад к приёмке</button>
<div class="hint">Излишки можно указывать несколько раз — акт обновляется, а не дублируется. ESC — назад.</div></div>`;
$('ok').onclick=async()=>{const t=+$('tt').value||0;if(t<=0){toast('Введи количество');return}
const {s,j}=await post('fix',{receipt_id:DOC.id,sku:ITEM.sku,batch:BATCH,pallet:PALLET,mode:'excess',total_qty:t,user_id:uid()});
if(j.error){toast('Ошибка: '+j.error);return}
toast(j.dev>0?('Излишек подтверждён: +'+fmt(j.dev)):('Количество подтверждено: '+fmt(j.fact)));
goReplace('accept',()=>scrAccept(0))};
$('bk').onclick=()=>back()}
// --- Этап: выбираем качество товара ---
function scrQuality(){SCREEN='quality';$('m').innerHTML=`<div class="card"><div class="step">ЭТАП 6 · КАЧЕСТВО · ${ITEM.sku}</div>
<h2>Качество товара? (${PENDING_QTY} шт)</h2>${batchBanner()}
<div class="mut">По умолчанию товар принимается с качеством «новый». Если брак — нажми «Брак».</div>
<div class="row2"><button class="green" id="g">Годный (новый)</button><button class="red" id="b">Брак</button></div>
<div id="rz" class="hidden"><select id="rs"><option value="">Причина брака...</option><option>бой</option><option>мятая упаковка</option></select><button class="red" id="bok">Записать брак</button></div></div>`;
$('g').onclick=async()=>{if(QTY_POSTED){toast('Количество уже принято');return}await acceptQty(PENDING_QTY)};
$('b').onclick=()=>$('rz').classList.remove('hidden');
$('bok').onclick=async()=>{const rs=$('rs').value;if(!rs){toast('Выбери причину брака');return}
const sendDefect=async(allowExcess)=>{const {s,j}=await post('qty',{receipt_id:DOC.id,sku:ITEM.sku,qty:PENDING_QTY,quality:'defect',reason:rs,pallet:PALLET,batch:BATCH,user_id:uid(),user_fio:ME?ME.fio:'',allow_excess:allowExcess?1:0});return {s,j}};
let r=await sendDefect(ALLOW_EXCESS);
if(r.j.need_excess){
 const rem=(r.j.remaining!=null?r.j.remaining:0),ent=(r.j.entered!=null?r.j.entered:PENDING_QTY);
 if(!confirm('Введено '+ent+' шт, а по документу ожидалось '+rem+' шт.\nПринять с излишком?')){toast('Количество не принято — исправьте количество');go('accept',()=>scrAccept(ent));return}
 ALLOW_EXCESS=true;r=await sendDefect(true);
}
const j=r.j;
if(j.error){if(j.need_batch){BATCHES=j.batches||BATCHES;toast('Выбери партию');go('batch',()=>scrBatch(null));return}toast('Ошибка: '+j.error);return}
ALLOW_EXCESS=false;toast('Брак записан: '+rs);goReplace('ean',scrEan)}}
// --- Марки DataMatrix, цикл (шаги 6-9) ---
function scrMarks(){SCREEN='marks';$('m').innerHTML=`<div class="card"><div class="step">МАРКИ · ${ITEM.sku} · в буфере: <b id="mc">${MARKS}</b></div>
<h2>Скан DataMatrix</h2>${batchBanner()}<input id="mk" placeholder="Марка..." autocomplete="off">
<div class="row2"><button class="green" id="g">Годный</button><button class="amber" id="u">Нечитаемая</button></div>
<button class="red" id="b">Брак</button>
<div id="rz" class="hidden"><select id="rs"><option value="">Причина...</option><option>бой</option><option>мятая упаковка</option><option>нечитаемая марка</option></select><button class="red" id="bok">Записать брак</button></div>
<button class="ghost" id="sscc">Принять целиком по SSCC (без вскрытия)</button>
<button class="ghost" id="done">Все марки (${MARKS}→ приёмка)</button></div>`;
const e=$('mk');e.focus();e.onkeydown=v=>{if(v.key==='Enter'){v.preventDefault();send('good')}};
$('g').onclick=()=>send('good');$('u').onclick=()=>send('unreadable');
$('b').onclick=()=>$('rz').classList.remove('hidden');$('bok').onclick=()=>send('defect');
$('sscc').onclick=()=>go('ssccitems',scrSsccItems);
$('done').onclick=()=>{if(!MARKS){if(CHZ){toast('Отсканируй хотя бы одну марку Честного знака');return}if(!confirm('Ни одной годной марки. К приёмке?'))return}go('accept',()=>scrAccept(MARKS))};
async function send(q){const mk=e.value.trim();if(!mk){toast('Отсканируй марку');return}
const b={receipt_id:DOC.id,sku:ITEM.sku,mark:mk,quality:q,batch:BATCH,user_id:uid()};
if(q==='defect'){b.reason=$('rs').value;if(!b.reason){toast('Выбери причину брака');return}}
const {s,j}=await post('mark',b);
if(j.error){if(j.need_batch){BATCHES=j.batches||BATCHES;toast('Выбери партию');go('batch',()=>scrBatch(null));return}toast('Ошибка: '+j.error);return}
if(q==='good'){MARKS++;toast('Марка в буфере ('+MARKS+')')}else if(q==='unreadable'){toast('Нечитаемая — отложи товар')}else{toast('Брак записан')}
scrMarksRefresh();async function scrMarksRefresh(){const mc=$('mc');if(mc)mc.textContent=MARKS;e.value='';e.focus();
const d=$('done');if(d)d.textContent=`Все марки (${MARKS}→ приёмка)`}}}
// --- Вложенность SSCC целиком без вскрытия (шаг 5 схемы) ---
function scrSsccItems(){SCREEN='ssccitems';let rows=[{sku:ITEM.sku,qty:1,batch:BATCH}];
function draw(){$('m').innerHTML=`<div class="card"><div class="step">SSCC ${PALLET} · ВЛОЖЕННОСТЬ</div><h2>Состав паллета</h2>${batchBanner()}
<div id="rw">${rows.map((r,i)=>`<div class="row2"><input data-i="${i}" data-k="sku" value="${r.sku}"><input data-i="${i}" data-k="qty" value="${r.qty}" inputmode="numeric"></div>`).join('')}</div>
<button class="ghost" id="add">+ строка</button><button id="go">Принять вложенность</button></div>`;
document.querySelectorAll('#rw input').forEach(inp=>inp.onchange=()=>{rows[+inp.dataset.i][inp.dataset.k]=inp.dataset.k==='qty'?+inp.value||0:inp.value});
$('add').onclick=()=>{rows.push({sku:'',qty:1,batch:BATCH});draw()};$('go').onclick=async()=>{
const items=rows.filter(r=>r.sku&&r.qty>0).map(r=>({sku:r.sku,qty:r.qty,batch:r.batch||BATCH}));if(!items.length){toast('Заполни состав');return}
const send=async(allowExcess)=>{const {j}=await post('sscc_accept',{receipt_id:DOC.id,sscc:PALLET,items,user_id:uid(),user_fio:ME?ME.fio:'',allow_excess:allowExcess?1:0});return j};
let j=await send(false);
if(j.need_excess){
 const rem=(j.remaining!=null?j.remaining:0),ent=(j.entered!=null?j.entered:0);
 if(!confirm('Введено '+ent+' шт, а по документу ожидалось '+rem+' шт.\nПринять с излишком?'))return;
 j=await send(true);
}
if(j.error){toast('Ошибка: '+j.error);return}
toast('Вложенность принята');if(typeof scrNextSmart==='function'){scrNextSmart()}else{scrNext()}}}
draw()}
// --- Подтвердить позицию + закрыть тарные места ---
async function scrConfirm(){SCREEN='confirm';
const F=await factOf();const cfPlan=F.plan,cfFact=F.fact;
// Открытые тарные места документа (приёмка идёт по SSCC — их может быть несколько).
const st=await (await api('?action=state&receipt_id='+DOC.id)).json();
const openPal=(st.pallets||[]).filter(p=>p.status!=='Закрыта');
const palTxt=openPal.length?openPal.map(p=>`${p.sscc} (${p.qty_total||0} шт)`).join(', '):(PALLET||'—');
$('m').innerHTML=`<div class="card"><div class="step">ФАКТ ${fmt(cfFact)} / ${fmt(cfPlan)}${BATCH!==''?' · ПАРТИЯ '+BATCH:''}</div>
<h2>Подтверди ${BATCH!==''?'партию':'позицию'}</h2><button id="cf">Подтвердить ${BATCH!==''?'партию':'позицию'}</button>
<div id="nx" class="hidden"><h2>Тарные места: ${palTxt}</h2><input id="w" placeholder="Вес, кг (необязательно)" inputmode="decimal">
<button id="pc">Закрыть тарные места</button></div></div>`;
$('cf').onclick=async()=>{const {j}=await post('confirm',{receipt_id:DOC.id,sku:ITEM.sku,batch:(BATCH||''),user_id:uid()});
if(j&&j.error){toast('Ошибка: '+j.error);return}$('nx').classList.remove('hidden');toast('Партия/позиция подтверждена')};
$('pc').onclick=async()=>{const list=openPal.length?openPal.map(p=>p.sscc):(PALLET?[PALLET]:[]);
for(const ss of list){const {j}=await post('pallet_close',{receipt_id:DOC.id,sscc:ss,weight:+$('w').value||0});
if(j.error){toast('Ошибка: '+j.error);return}}
if(list.length)toast('Тарные места закрыты: '+list.length);PALLET=null;scrNextSmart()}}
// После партии того же SKU с остатком — предложить следующую партию,
// а не прыгать сразу на скан другого штрихкода (иначе теряется контекст SSCC/партии).
async function scrNextSmart(){try{
if(ITEM&&ITEM.sku){const r=await api('?action=fact&receipt_id='+DOC.id+'&sku='+encodeURIComponent(ITEM.sku));const jj=await r.json();
BATCHES=jj.batches||BATCHES;
const unf=(BATCHES||[]).filter(b=>Math.round(((+b.plan||0)-(+b.fact||0))*1000)/1000>0);
if(BATCHES.length>1&&unf.length>0){BATCH='';toast('Партия принята. Осталось партий по '+ITEM.sku+': '+unf.length+' — выбери следующую');go('batch',()=>scrBatch(null));return}}
}catch(e){}
scrNext()}
// --- Куда дальше — решает система: осталось что принимать -> скан штрихкода,
// всё принято -> автозакрытие (кросс-док закрывается вручную через scrFinish) ---
async function scrNext(){SCREEN='next';const st=await (await api('?action=state&receipt_id='+DOC.id)).json();
let rem=0;
// Считаем по позициям-партиям: закрытая позиция (принята полностью или с зафиксированным
// расхождением — недостача/излишек) больше не требует приёмки.
if(st.scopes&&st.scopes.length){for(const s of st.scopes){if(s.closed)continue;rem+=Math.max(0,(+s.plan||0)-(+s.fact||0))}}
else{for(const i of (st.items||[])){rem+=Math.max(0,(+i.qty||0)-(+i.fact||0))}}
rem=Math.round(rem*1000)/1000;
if(rem>0){toast('Осталось принять: '+rem+' шт — следующий товар');go('ean',scrEan);return}
if(CROSS){go('finish',scrFinish);return}
const {j}=await post('close',{receipt_id:DOC.id,user_id:uid()});
if(j.error){toast('Ошибка закрытия: '+j.error);go('finish',scrFinish);return}
showClosed(j)}
// --- Финал: закрытие документа + сформированные акты ---
function showClosed(j){const acts=(j.acts&&j.acts.length)?j.acts:[];
const rows=acts.map(a=>`<tr><td>${a.title||a.type}</td><td>${a.count}</td><td>${a.qty}</td></tr>`).join('')
||'<tr><td colspan=3>Акты не формировались</td></tr>';
const dev=j.deviation?`<div class="mut">Отклонение: <b>${j.deviation}</b> (излишек ${fmt(j.excess_qty||0)} шт, недостача ${fmt(j.shortage_qty||0)} шт)</div>`:'';
$('m').innerHTML=`<div class="card green"><div class="step">КОНЕЦ ПРИЁМКИ</div><h2>Документ закрыт ✓</h2>
<div class="mut">Статус: <b>${j.status_label||'Закрыто'}</b></div>
<div class="mut">Прогресс: ${j.progress.fact} / ${j.progress.plan} · ${j.progress.pct}%</div>${dev}
<h2>Сформированные акты</h2><table class="mini"><tr><th>Акт</th><th>Строк</th><th>Штук</th></tr>${rows}</table>
<button class="ghost" id="bk">К документам</button></div>`;
$('bk').onclick=()=>go('docs',scrDocs)}
async function scrFinish(){SCREEN='finish';let h=`<div class="card"><div class="step">ЗАКРЫТИЕ</div><h2>Закрытие документа</h2>`;
if(CROSS){const {j}=await post('crossdock_move',{receipt_id:DOC.id,sscc:PALLET||''});
h+=j.error?`<div class="mut">Кросс-док: ${j.error}</div>`:`<div class="mut">Кросс-док → в зоне отгрузки ✓</div>`}
h+=`<button id="cl">Закрыть документ / сформировать акты</button></div>`;$('m').innerHTML=h;
$('cl').onclick=async()=>{const {j}=await post('close',{receipt_id:DOC.id,user_id:uid()});
if(j.error){toast('Ошибка закрытия: '+j.error);return}
showClosed(j)}}
go('gate',scrGate);
</script>
</body>
</html>
