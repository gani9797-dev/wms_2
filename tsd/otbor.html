<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ТСД — Отбор</title>
<style>
:root{--vio:#6432FF;--ink:#1C2331;--mut:#8A92A6;--line:#EAEAEA;--bg:#F4F5F7;--ok:#2E7D32;--bad:#C62828;--warn:#E65100}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--ink);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5}
header .t{display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}header small{color:var(--mut);display:block;font-size:12px}
header a{color:#fff;text-decoration:none;font-size:16px;border:1px solid #444;border-radius:8px;padding:6px 10px}
main{padding:12px;max-width:640px;margin:0 auto;padding-bottom:40px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card.red{border-color:#EF9A9A;background:#FFEBEE}.card.green{border-color:#A5D6A7;background:#E8F5E9}.card.amber{border-color:#FFCC80;background:#FFF8E1}
h2{margin:0 0 8px;font-size:20px}.mut{color:var(--mut);font-size:13px}
.qtybig{margin:10px 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#F8F6FF}
.qtybig b{font-size:52px;line-height:1;font-weight:800;color:var(--vio)}
.qtybig span{font-size:22px;font-weight:700;color:var(--ink)}
.qtybig .mut{margin-top:4px;font-size:14px}
input,select{width:100%;font-size:20px;padding:14px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:#fff}
button{width:100%;font-size:19px;font-weight:700;padding:16px;border-radius:12px;border:1px solid var(--vio);background:var(--vio);color:#fff;cursor:pointer;margin:6px 0;min-height:58px}
button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
button.red{background:var(--bad);border-color:var(--bad)}
button.green{background:var(--ok);border-color:var(--ok)}
button.amber{background:#EF6C00;border-color:#EF6C00}
button.small{font-size:16px;padding:12px;min-height:48px}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.prog{height:12px;background:#E6E6E6;border-radius:8px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:#009900}
.doc{padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;cursor:pointer}
.doc b{color:var(--vio);font-size:18px}
.step{font-size:12px;color:var(--vio);font-weight:700;margin-bottom:4px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;display:none;z-index:99;max-width:92vw;font-size:16px}
table.mini{width:100%;border-collapse:collapse;font-size:14px}table.mini td,table.mini th{border-bottom:1px solid #F0F0F0;padding:8px;text-align:left}
.hidden{display:none}
#navback{position:fixed;left:12px;bottom:16px;z-index:98;width:auto;padding:12px 18px;min-height:48px;font-size:16px;display:none;background:#fff;color:#1C2331;border:1px solid #EAEAEA;border-radius:12px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.15);cursor:pointer;margin:0}
</style>
</head>
<body>
<header><div class="t"><a href="app.html">‹ Меню</a><b>ТСД — Отбор</b><span id="who" style="font-size:12px;color:#7CFC9A"></span></div><small id="dhead">роль → режим отбора</small></header>
<main id="m"></main>
<div id="toast"></div>
<button id="navback">← Назад</button>
<script>
const $=id=>document.getElementById(id);
const TOKEN=localStorage.getItem('tsd_token')||(window.WMS_TSD_TOKEN||'tsd-12345');
const ME=JSON.parse(localStorage.getItem('tsd_me')||'null');
if(ME)$('who').textContent=ME.fio;
const uid=()=>ME?ME.id:null;
const ufio=()=>ME?ME.fio:'';
let ROLE=localStorage.getItem('tsd_role')||((ME&&/водител|driver/i.test(ME.role||''))?'driver':((ME&&ME.role)?'storekeeper':''));
let DOC=null,ITEMS=[],IDX=0,PALLET=null,WAVE=null,GATE_PICK='';
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3000)}
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function api(p,o){o=o||{};o.headers=Object.assign({'Content-Type':'application/json','X-Tsd-Token':TOKEN},o.headers||{});return fetch('otbor.php'+p+(p.includes('?')?'&':'?')+'token='+encodeURIComponent(TOKEN),o)}
function apiPick(p,o){o=o||{};o.headers=Object.assign({'Content-Type':'application/json','X-Tsd-Token':TOKEN},o.headers||{});return fetch('tasks.php'+p+(p.includes('?')?'&':'?')+'token='+encodeURIComponent(TOKEN),o)}
const post=(a,b)=>api('?action='+a,{method:'POST',body:JSON.stringify(b||{})}).then(r=>r.json().then(j=>({s:r.status,j})));
const postPick=(a,b)=>apiPick('?action='+a,{method:'POST',body:JSON.stringify(b||{})}).then(r=>r.json().then(j=>({s:r.status,j})));
function head(t){$('dhead').textContent=t||''}
// --- Навигация: стек кадров; кнопка «← Назад» и ESC возвращают на предыдущий кадр ---
let NAV=[];
function paintBack(){const b=$('navback');if(b)b.style.display=NAV.length>1?'block':'none'}
function go(name,fn){NAV.push({name,fn});if(NAV.length>40)NAV.splice(0,NAV.length-40);paintBack();const r=fn();if(r&&r.catch)r.catch(()=>{})}
function back(){if(NAV.length>1){NAV.pop();paintBack();const r=NAV[NAV.length-1].fn();if(r&&r.catch)r.catch(()=>{})}}
$('navback').onclick=()=>back();
document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();back()}});
function myCellKey(){return 'otbor_user_cell_'+(uid()||'anon')}
function myCell(){return localStorage.getItem(myCellKey())||''}
function setMyCell(v){if(v)localStorage.setItem(myCellKey(),v);else localStorage.removeItem(myCellKey())}
// Виртуальная промежуточная ячейка пользователя: VIRT-<user_id> (без id — VIRT-1).
function vcell(){return 'VIRT-'+(uid()||1)}
// Состояние буфера отбора (позиции в промежуточной ячейке / на воротах / собрано).
function bufLine(b){
  if(!b)return '';
  const parts=[];
  if(b.picked)parts.push('в промежуточной ячейке: '+b.picked);
  if(b.at_gate)parts.push('на воротах: '+b.at_gate);
  if(b.assembled)parts.push('собрано: '+b.assembled);
  return parts.length?parts.join(' · '):'пусто';
}
// --- Сверка скана: артикул, код строки и штрихкоды номенклатуры («Штрихкоды (через запятую)»).
//     Пробелы не учитываем: «4 673192631679» = «4673192631679».
const normCode=s=>String(s==null?'':s).replace(/\s+/g,'');
const itemCodes=it=>[it.sku,it.code].concat(it.barcodes||[]).filter(Boolean).map(normCode);
const matchItemCode=(it,v)=>{const c=normCode(v);return c!==''&&itemCodes(it).includes(c)};

// ---------- Роль (системно по настройкам, вручную — проверка) ----------
function scrRole(){
  head('роль → режим отбора');
  const busy=myCell();
  $('m').innerHTML=`<div class="card"><div class="step">ОТБОР · РОЛЬ</div><h2>Кто отбирает?</h2>
  <div class="mut">Определяется системно по роли в настройках. Проверь:</div>
  <div class="row2"><button id="sk" class="${ROLE==='storekeeper'?'':'ghost'}">Кладовщик · ручной</button><button id="dr" class="${ROLE==='driver'?'':'ghost'}">Водитель</button></div>
  ${busy?`<div class="card amber" style="margin-top:8px"><b>Ячейка пользователя занята: ${busy}</b><div class="mut">При начале нового отбора ячейка должна быть пустой. Вернись на форму или освободи.</div><button class="ghost" id="clr">Освободить ячейку</button></div>`:''}
  <button id="go" class="green">К выбору режима →</button></div>`;
  $('sk').onclick=()=>{ROLE='storekeeper';localStorage.setItem('tsd_role',ROLE);go('mode',scrMode)};
  $('dr').onclick=()=>{ROLE='driver';localStorage.setItem('tsd_role',ROLE);go('mode',scrMode)};
  const c=$('clr');if(c)c.onclick=()=>{setMyCell('');scrRole()};
  $('go').onclick=()=>{if(myCell()){toast('Ячейка пользователя не пустая');return}go('mode',scrMode)};
}
// ---------- Режим отбора: по документу / по зоне / по заданиям ----------
function scrMode(){
  head('режим отбора');
  const roleRu=ROLE==='driver'?'ОТБОР ВОДИТЕЛЕМ':'РУЧНОЙ ОТБОР';
  const busy=myCell();
  $('m').innerHTML=`<div class="card"><div class="step">${roleRu}</div><h2>Как отбираем?</h2>
  <div class="mut">Роль: ${ROLE==='driver'?'Водитель':'Кладовщик'}.${ROLE==='driver'?' Отбор водителем: зоны ячеек с отбором водителем.':' Ручной отбор: зоны ячеек с ручным отбором.'}</div>
  ${busy?`<div class="card amber" style="margin-top:8px"><b>Ячейка пользователя занята: ${busy}</b><div class="mut">При начале нового отбора ячейка должна быть пустой. Вернись на форму или освободи.</div><button class="ghost" id="clr">Освободить ячейку</button></div>`:''}
  <button id="mdoc">1. Отбор по документу</button>
  <button id="mzone">2. Отбор по зоне</button>
  <button id="mtask">3. Отбор по заданиям</button>
  <button class="ghost" id="mrole">Сменить роль</button>
  <button class="ghost" id="mback">В меню</button></div>`;
  $('mdoc').onclick=()=>go('doc',scrDoc);
  $('mzone').onclick=()=>go('zone',scrZones);
  $('mtask').onclick=()=>go('tasks',scrPickTasks);
  $('mrole').onclick=()=>go('role',scrRole);
  $('mback').onclick=()=>location.href='app.html';
  const c=$('clr');if(c)c.onclick=()=>{setMyCell('');scrMode()};
}
// ---------- Запрет отбора: товар ещё не на воротах / не собран ----------
function showBlock(jj,backFn){
  $('m').innerHTML=`<div class="card amber"><div class="step">ОТБОР ЗАПРЕЩЁН</div>
  <h2>${esc(jj.error||'Отбор запрещён')}</h2>
  <div class="mut">Товар лежит в виртуальной промежуточной ячейке ${esc(vcell())}. Отнеси паллету на ворота сортировки и соберите её на сборочной паллете по SSCC — после этого отбор снова доступен.</div>
  <button class="ghost" id="bk">Назад</button></div>`;
  $('bk').onclick=()=>{const f=backFn||scrDoc;go('list',f)};
}
// ---------- Отбор по документу: отгрузки по приоритетам ----------
// Роль: водитель => уровень ячейки >= 2, кладовщик => уровень ячейки = 1.
async function scrDoc(){
  DOC=null;ITEMS=[];IDX=0;PALLET=null;WAVE=null;head('отбор по документу: отгрузки по приоритетам');
  const r=await api('?action=tasks&role='+ROLE);const j=await r.json();
  const rows=j.rows||[];
  if(!rows.length){
    $('m').innerHTML=`<div class="card amber"><div class="step">${ROLE==='driver'?'ОТБОР ВОДИТЕЛЕМ':'РУЧНОЙ ОТБОР'}</div><h2>Уведомление. Отгрузок нет</h2><div class="mut">${ROLE==='driver'?'Водитель: уровень ячейки ≥ 2':'Кладовщик: уровень ячейки = 1'}. Выпусти задания из Отгрузок (ПКМ → Выпуск заданий на отбор).</div><button class="ghost" id="bk">К режимам отбора</button></div>`;
    $('bk').onclick=()=>go('mode',scrMode);return;
  }
  const wv=j.wave||{};
  const roleHint=ROLE==='driver'?'Водитель: уровень ячейки ≥ 2':'Кладовщик: уровень ячейки = 1';
  $('m').innerHTML=`<div class="card"><div class="step">${ROLE==='driver'?'ОТБОР ВОДИТЕЛЕМ':'РУЧНОЙ ОТБОР'} · ОТБОР ПО ДОКУМЕНТУ</div>
  <h2>Отгрузки: ${rows.length}</h2>
  <div class="mut">${roleHint}</div>
  ${wv.possible?`<div class="card amber"><b>Волна возможна</b><div class="mut">${wv.hint}. Пересечение: ${Object.keys(wv.cross_sku||{}).join(', ')}</div><button id="wave">Собрать волной</button></div>`:''}
  <div class="mut">id переходит в «в работе» и закрепляется за тобой. Выход → «в ожидании», таймер 2 мин, иначе возврат в доступ.</div></div>`
  +rows.map(t=>`<div class="doc" data-id="${t.id}"><b>№${t.doc_no}</b> <span class="mut">приоритет ${t.prio} · ${t.pick_type_ru}</span><br>
    <span class="mut">${t.consignee||''} · ворота ${t.gate||'—'}${t.levels?(' · уровни '+t.levels.join(',')):''} · ${t.status}${t.lock_status?(' · '+t.lock_status+' ('+(t.lock_fio||t.lock_user||'')+')'):''}</span>
    <div class="prog"><i style="width:${t.pct}%"></i></div><span class="mut">${t.fact_qty||0} / ${t.plan_qty||0}</span></div>`).join('');
  const w=$('wave');if(w)w.onclick=()=>go('wave',()=>scrWave(rows,wv));
  document.querySelectorAll('[data-id].doc').forEach(el=>el.onclick=async()=>{
    const id=+el.dataset.id;
    const {s,j:jj}=await post('take',{shipment_id:id,user_id:uid(),user_fio:ufio()});
    if(jj.error){toast(jj.error+(jj.busy_id?(' (№'+jj.busy_id+')'):''),4500);if(jj.need_assembly){showBlock(jj,scrDoc);return}if(jj.busy_id)scrDoc();return}
    const st=await (await api('?action=task&id='+id)).json();
    if(st.error){toast(st.error);return}
    DOC=st.head;DOC.shipment_doc_no=st.head.doc_no;DOC.buffer=st.buffer||null;
    ITEMS=(st.items||[]).filter(i=>(+i.plan_qty||0)-(+i.fact_qty||0)>1e-9);
    if(!ITEMS.length){toast('По заданию всё отобрано');go('doc',scrDoc);return}
    IDX=0;PALLET=null;go('head',scrHead);
  });
}
// ---------- Отбор по заданиям: задания модуля Задания (волна/строки) ----------
async function scrPickTasks(){
  DOC=null;ITEMS=[];IDX=0;PALLET=null;WAVE=null;head('отбор по заданиям');
  let picks=[],brokenHint=null;
  try{
    const rp=await apiPick('?action=tasks&type='+encodeURIComponent('сбор')+'&role='+ROLE);
    const jp=await rp.json();
    picks=jp.rows||[];
    brokenHint=jp.broken_hint||null;
  }catch(e){picks=[]}
  if(!picks.length){
    $('m').innerHTML=`<div class="card amber"><div class="step">${ROLE==='driver'?'ОТБОР ВОДИТЕЛЕМ':'РУЧНОЙ ОТБОР'}</div><h2>Уведомление. Заданий нет</h2><div class="mut">${ROLE==='driver'?'Водитель: уровень ячейки ≥ 2':'Кладовщик: уровень ячейки = 1'}. Выпусти задания из Отгрузок (ПКМ → Выпуск заданий на отбор) или открой «Отбор по зоне».</div>${brokenHint?`<div class="mut" style="margin-top:8px">${esc(brokenHint)}</div>`:''}<button class="ghost" id="bk">К режимам отбора</button></div>`;
    $('bk').onclick=()=>go('mode',scrMode);return;
  }
  $('m').innerHTML=`<div class="card"><div class="step">${ROLE==='driver'?'ОТБОР ВОДИТЕЛЕМ':'РУЧНОЙ ОТБОР'} · ОТБОР ПО ЗАДАНИЯМ</div>
  <h2>Задания на отбор: ${picks.length}</h2>
  <div class="mut">id переходит в «в работе» и закрепляется за тобой.</div>
  ${brokenHint?`<div class="mut" style="margin-top:8px">${esc(brokenHint)}</div>`:''}</div>`
  +`<div class="card"><div class="step">ЗАДАНИЯ ИЗ ОТГРУЗОК (ВОЛНА/СТРОКИ)</div>`
  +picks.map(t=>`<div class="doc" data-pick="${t.id}"><b>№${t.doc_no}</b> <span class="mut">приоритет ${t.prio} · сбор</span><br>
    <span class="mut">отгрузка: ${esc(t.shipment_doc_no||t.doc_ref||'—')}${t.consignee?(' · '+esc(t.consignee)):''}${t.levels?(' · уровни '+t.levels.join(',')):''} · ${t.status}${t.lock_status?(' · '+t.lock_status+' ('+(t.lock_fio||t.lock_user||'')+')'):''}</span>
    <div class="prog"><i style="width:${t.pct}%"></i></div><span class="mut">${t.fact_qty||0} / ${t.plan_qty||0}</span></div>`).join('')+`</div>`;
  document.querySelectorAll('[data-pick]').forEach(el=>el.onclick=()=>openPickTask(+el.dataset.pick));
}
// ---------- Отбор по зоне: зоны отбора ячеек ----------
async function scrZones(){
  DOC=null;ITEMS=[];IDX=0;PALLET=null;WAVE=null;head('отбор по зоне: зоны ячеек');
  let j={rows:[]};
  try{ j=await (await apiPick('?action=zones&role='+ROLE)).json(); }catch(e){}
  const rows=j.rows||[];
  const mine=rows.filter(z=>z.mine);
  if(!rows.length){
    $('m').innerHTML=`<div class="card amber"><div class="step">ОТБОР ПО ЗОНЕ</div><h2>Уведомление. Зон нет</h2><div class="mut">В модуле «Ячейки хранения» проставь ячейкам дополнительные зоны: Ручной отбор / Отбор водителем.</div><button class="ghost" id="bk">К режимам отбора</button></div>`;
    $('bk').onclick=()=>go('mode',scrMode);return;
  }
  $('m').innerHTML=`<div class="card"><div class="step">ОТБОР ПО ЗОНЕ</div><h2>Зоны отбора ячеек</h2>
  <div class="mut">${j.role_hint||''}</div>
  <div class="mut">Выбери зону — система сформирует списки заданий (PK-000001 …). Список типа «ручной отбор» падает только роли Кладовщик, «отбор водителем» — только роли Водитель.</div></div>`
  +(mine.length?mine:rows).map(z=>`<div class="doc" data-zone="${z.zone}"><b>${esc(z.label)}</b> <span class="mut">${z.role_ru}</span><br>
    <span class="mut">ячеек: ${z.cells} · списков: ${z.lists}${z.mine?' · <b>ваша зона</b>':''}</span></div>`).join('');
  document.querySelectorAll('[data-zone]').forEach(el=>el.onclick=()=>go('zonelists',()=>scrZoneLists(el.dataset.zone)));
}
// ---------- Отбор по зоне: списки заданий (PK-000001 ...) ----------
async function scrZoneLists(zone){
  DOC=null;ITEMS=[];IDX=0;PALLET=null;WAVE=null;head('отбор по зоне: списки заданий');
  let j={rows:[]};
  try{ j=await (await apiPick('?action=zone_lists&zone='+encodeURIComponent(zone)+'&role='+ROLE+'&user_id='+(uid()||0))).json(); }catch(e){}
  const rows=j.rows||[];
  const sum=j.summary||{};
  if(j.error){
    $('m').innerHTML=`<div class="card amber"><div class="step">ОТБОР ПО ЗОНЕ</div><h2>Уведомление. Доступ закрыт</h2>
      <div class="mut">${esc(j.error)}</div>
      <button class="ghost" id="bk">К зонам</button><button class="ghost" id="bm">К режимам отбора</button></div>`;
    $('bk').onclick=()=>go('zone',scrZones);$('bm').onclick=()=>go('mode',scrMode);return;
  }
  if(!rows.length){
    $('m').innerHTML=`<div class="card amber"><div class="step">ОТБОР ПО ЗОНЕ</div><h2>Уведомление. Списков нет</h2>
      <div class="mut">${sum.note||'Нет отгрузок с товаром в ячейках этой зоны.'}</div>
      <button class="ghost" id="bk">К зонам</button><button class="ghost" id="bm">К режимам отбора</button></div>`;
    $('bk').onclick=()=>go('zone',scrZones);$('bm').onclick=()=>go('mode',scrMode);return;
  }
  $('m').innerHTML=`<div class="card"><div class="step">ОТБОР ПО ЗОНЕ · ${esc(j.zone_label||zone)}</div>
  <h2>Списки заданий: ${rows.length}</h2>
  <div class="mut">Отгрузок в зоне: ${sum.shipments||0} · заданий: ${sum.tasks||0}. В списке — одна отгрузка (нарядов может быть несколько).</div></div>`
  +rows.map(l=>`<div class="doc" data-list="${l.id}"><b>${esc(l.code)}</b> <span class="mut">${esc(l.type_ru)}</span><br>
    <span class="mut">отгрузка: ${esc(l.shipment_doc_no||'—')}${l.orders&&l.orders.length?(' · наряды: '+l.orders.map(o=>esc(o.doc_no)).join(', ')):''}${l.name?(' · '+esc(l.name)):''} · заданий: ${l.tasks_count} (в работе ${l.tasks_open})</span>
    <div class="prog"><i style="width:${l.pct}%"></i></div><span class="mut">${l.fact_qty} / ${l.plan_qty}</span></div>`).join('');

    ? await postPick('confirm',{task_id:DOC.id,sku:it.sku,qty:it._q,cell:it.cell,pallet:PALLET,user_id:uid()})
    : await post('confirm',{shipment_id:DOC.id,sku:it.sku,qty:it._q,cell:it.cell,pallet:PALLET,user_id:uid()});
  if(j.error){toast('Ошибка: '+j.error+(j.need!=null?(' · к отбору '+j.need):''),4500);
    if(j.need_assembly){showBlock(j,scrDoc);return}
    go('qty',scrQty);return}
  $('m').innerHTML=`<div class="card green"><div class="step">СТРОКА ГОТОВА · ${it.sku} × ${it._q} → ${PALLET||'—'}</div>
  <h2>Товар в промежуточной ячейке: ${esc(vcell())}</h2>
  <div class="mut">Список задания не окончен? Товар остаётся в виртуальной ячейке, пока не отправлен на ворота сортировки.</div>
  <div class="row2"><button id="y">Да — след. строка</button><button class="green" id="n">Нет — к воротам</button></div></div>`;
  $('y').onclick=async()=>{
    if(isPick){
      const st=await (await apiPick('?action=task&id='+DOC.id)).json();
      ITEMS=(st.items||[]).map(x=>({sku:x.sku,code:x.code,name:x.name,unit:x.unit,plan_qty:x.plan_qty,fact_qty:x.fact_qty,need:Math.max(0,(+x.plan_qty||0)-(+x.fact_qty||0)),cell:x.cell_from||x.cell||'',supplier_batch:x.supplier_batch||'',barcodes:x.barcodes||[]})).filter(x=>x.need>1e-9);
    }else{
      const st=await (await api('?action=task&id='+DOC.id)).json();
      ITEMS=(st.items||[]).filter(i=>(+i.plan_qty||0)-(+i.fact_qty||0)>1e-9);
    }
    IDX=0;if(!ITEMS.length){go('gate',scrGate);return}go('head',scrHead);
  };
  $('n').onclick=()=>go('gate',scrGate);
}
// ---------- Отправка паллеты на ворота сортировки ----------
// Ворота отгрузки (shipments.gate / gates_extra) — источник истины:
// можно выбрать только те ворота, что указаны в отгрузке.
async function scrGate(){
  const h=DOC||{};
  const isPick=!!h._pick;
  head('отправка на ворота сортировки · '+(h.doc_no||''));
  $('m').innerHTML=`<div class="card"><div class="step">ОТПРАВКА ПАЛЛЕТЫ НА ВОРОТА СОРТИРОВКИ</div>
    <h2>№ ${esc(h.doc_no||'')} · ${esc(h.consignee||'')}</h2>
    <div class="mut">Отгрузка: ${esc(h.shipment_doc_no||'—')} · промежуточная ячейка: ${esc(vcell())}</div>
    <div class="mut">Загружаю ворота отгрузки…</div></div>`;
  let g={gates:[],has_gates:false};
  try{
    const r=isPick?await apiPick('?action=gate_info&task_id='+h.id):await api('?action=gate_info&shipment_id='+h.id);
    const j=await r.json();
    if(j&&!j.error)g=j;
  }catch(e){}
  const gates=g.gates||[];
  if(!GATE_PICK||gates.indexOf(GATE_PICK)<0)GATE_PICK=gates[0]||'';
  const cur=GATE_PICK;
  $('m').innerHTML=`<div class="card"><div class="step">ОТПРАВКА ПАЛЛЕТЫ НА ВОРОТА СОРТИРОВКИ</div>
    <h2>№ ${esc(h.doc_no||'')} · ${esc(h.consignee||'')}</h2>
    <div class="mut">Отгрузка: ${esc(h.shipment_doc_no||'—')} · товар в промежуточной ячейке: ${esc(vcell())}</div>
    <input id="sscc" placeholder="Сканируй SSCC паллеты" value="${esc(PALLET||myCell()||'')}" autocomplete="off" inputmode="none">
    <div class="mut" style="margin-top:12px"><b>Ворота отгрузки (источник истины):</b></div>
    ${gates.length
      ? `<div id="chips" style="display:flex;flex-wrap:wrap;gap:8px;margin:8px 0">${gates.map(x=>`<button type="button" class="small chip${x===cur?'':' ghost'}" data-g="${esc(x)}" style="width:auto;margin:0">${esc(x)}</button>`).join('')}</div>`
      : `<div class="card amber" style="margin:8px 0"><b>В отгрузке ворота не указаны</b><div class="mut">Укажи ворота вручную — система не сможет проверить их по отгрузке.</div></div>
         <input id="gatein" placeholder="Введи номер ворот" inputmode="numeric">`}
    <div class="mut">Подсказка: ворота отгрузки — источник истины. Ворота, которых нет в отгрузке, система не пропустит («Ворота X не указаны в отгрузке …»).</div>
    <button id="go" class="green">Отправить на ворота</button>
    <button class="ghost" id="bk">Назад</button></div>`;
  document.querySelectorAll('.chip').forEach(el=>el.onclick=()=>{
    GATE_PICK=el.dataset.g;
    document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('ghost',x.dataset.g!==GATE_PICK));
  });
  $('bk').onclick=()=>back();
  $('go').onclick=async()=>{
    const ss=($('sscc').value||'').trim();
    if(!ss){toast('Отсканируй SSCC паллеты');return}
    const gi=$('gatein');
    const gate=gi?((gi.value||'').trim()):GATE_PICK;
    if(!gate){toast('Укажи ворота сортировки');return}
    if(!confirm('Паллета '+ss+' физически перенесена на ворота '+gate+'? OK=Да / Отмена=Нет (системная ошибка)')){
      const body0={pallet:ss,gate:gate,gate_cell:'ВОРОТА-'+gate,user_id:uid(),user_fio:ufio(),moved_ok:0};
      if(isPick)body0.task_id=h.id;else body0.shipment_id=h.id;
      const {j:j0}=isPick?await postPick('move_to_sort',body0):await post('move_to_sort',body0);
      const l=(j0&&j0.log)||{};
      $('m').innerHTML=`<div class="card red"><div class="step">СИСТЕМНАЯ ОШИБКА</div>
        <h2>Паллета не перенесена. Обратись к оператору</h2>
        <div class="mut">Log: ячейка сортировки ${esc(l.cell||'')} · паллет ${esc(l.sku||ss)} · ${esc(ufio())} · ${esc(l.dt||'')} · уведомление в WMS отправлено</div>
        <button class="ghost" id="go2">В меню</button></div>`;
      $('go2').onclick=()=>location.href='app.html';
      return;
    }
    const body={pallet:ss,gate:gate,gate_cell:'ВОРОТА-'+gate,user_id:uid(),user_fio:ufio(),moved_ok:1};
    if(isPick)body.task_id=h.id;else body.shipment_id=h.id;
    const {s,j}=isPick?await postPick('move_to_sort',body):await post('move_to_sort',body);
    if(j.error){toast('Ошибка: '+j.error,5000);return}
    if(j.ok===false){
      const l=j.log||{};
      $('m').innerHTML=`<div class="card red"><div class="step">СИСТЕМНАЯ ОШИБКА</div>
        <h2>Паллета не перенесена. Обратись к оператору</h2>
        <div class="mut">Log: ячейка сортировки ${esc(l.cell||'')} · паллет ${esc(l.sku||ss)} · ${esc(ufio())} · ${esc(l.dt||'')} · уведомление в WMS отправлено</div>
        <button class="ghost" id="go2">В меню</button></div>`;
      $('go2').onclick=()=>location.href='app.html';
      return;
    }
    // Волна: остальные отгрузки волны — на те же ворота.
    if(WAVE&&Array.isArray(WAVE.details)&&WAVE.details.length>1){
      for(let i=1;i<WAVE.details.length;i++){
        const d=WAVE.details[i].head;
        await post('move_to_sort',{shipment_id:d.id,pallet:ss,gate:gate,gate_cell:'ВОРОТА-'+gate,user_id:uid(),user_fio:ufio(),moved_ok:1});
      }
    }
    setMyCell('');GATE_PICK='';
    $('m').innerHTML=`<div class="card green"><div class="step">ПАЛЛЕТА НА ВОРОТАХ</div>
    <h2>Паллета ${esc(ss)} отправлена на ворота ${esc(gate)}</h2>
    <div class="mut">Товар ждёт сборки на сборочной паллете (сканируется SSCC на экране сортировки). До сборки следующий отбор запрещён.</div>
    <div class="row2"><button id="y">Да, продолжить</button><button class="ghost" id="n">Нет, в меню</button></div></div>`;
    $('y').onclick=()=>go('mode',scrMode);$('n').onclick=()=>location.href='app.html';
  };
}
// Роль уже выбрана в меню (или известна из входа) — сразу к режимам отбора; экран выбора роли — если роль неизвестна.
if(ROLE){go('mode',scrMode)}else{go('role',scrRole)}
</script>
</body>
</html>
